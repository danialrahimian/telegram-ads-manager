[project]
name = "telegram-ads-manager"
version = "2.2.0"
description = "Self-hosted manager for several Telegram Ads accounts and their sales bots"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]
e2e = [
    "playwright>=1.56",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",    # assert in tests
    "RUF001", "RUF002", "RUF003",  # Persian text contains look-alike characters by design
    "B008",    # FastAPI Depends() in defaults
    "E501",    # long Persian user-facing strings; the formatter handles code width
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S311", "ASYNC240", "ASYNC230"]
"tests/e2e/**" = ["S603"]
"alembic/**" = ["E501", "W291"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
